name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (existing, or new with source_sha)
        required: true
        type: string
      source_sha:
        description: Full commit SHA for a new tag (leave empty to rebuild an existing draft)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_SOURCE_INPUT: ${{ inputs.source_sha }}

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Validate requested tag and optional immutable SHA
        shell: python
        run: |
          import os
          import re
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_TAG"]):
              raise SystemExit("Expected a stable vX.Y.Z tag")
          sha = os.environ["RELEASE_SOURCE_INPUT"]
          if sha and not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("source_sha must be a full lowercase 40-character commit SHA")
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || format('refs/tags/{0}', inputs.tag || github.ref_name) }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Match source, tag, manifest, lockfile, documentation, and notes
        id: source
        shell: bash
        run: |
          sha="$(python packaging/verify_release.py source --tag "$RELEASE_TAG")"
          if [ -n "$RELEASE_SOURCE_INPUT" ]; then test "$sha" = "$RELEASE_SOURCE_INPUT"; fi
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Reject moved tags and already published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          options=()
          if [ -n "$RELEASE_SOURCE_INPUT" ]; then options+=(--allow-missing); fi
          python packaging/prepare_release.py check --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" "${options[@]}"

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.source_sha }}

  build:
    name: build (${{ matrix.target }})
    needs: [validate, checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # A native arm64 runner, so the GUI's system libraries need no
          # cross-compilation sysroot.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Cross-compiled from x64: the MSVC arm64 linker ships with the
          # runner's Visual Studio.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify checked release source
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: python packaging/verify_release.py source --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository pins its toolchain; add the cross-target's standard
      # library to the toolchain the pin actually resolves to.
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Vendor yt-dlp
        shell: bash
        run: bash third_party/yt-dlp/vendor.sh --target ${{ matrix.target }} --require

      - run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Check Linux binary version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          actual="$(target/${{ matrix.target }}/release/oxidify --version)"
          test "$actual" = "oxidify ${RELEASE_TAG#v}"

      - name: Package
        shell: bash
        run: |
          name="oxidify-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/oxidify.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/oxidify" "dist/$name/"
          fi
          cp README.md LICENSE NOTICE "dist/$name/"
          cp third_party/yt-dlp/NOTICE "dist/$name/yt-dlp-NOTICE.txt"
          cp third_party/yt-dlp/LICENSE "dist/$name/yt-dlp-LICENSE.txt"
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Desktop integration for package builds and hand-installs.
            mkdir -p "dist/$name/packaging"
            git archive HEAD packaging | tar -x -C "dist/$name"
            rm -rf "dist/$name/packaging/macos"
          fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      # Inno Setup ships with the runner image. PowerShell, because bash on
      # Windows rewrites /D... arguments as paths.
      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $arch = "${{ matrix.target }}".Split("-")[0]
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DArch=$arch" `
            "/DBinary=$PWD\target\${{ matrix.target }}\release\oxidify.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\oxidify.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test Windows x64 installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $destination = Join-Path $env:RUNNER_TEMP 'oxidify-install-test'
          $setup = Join-Path $PWD "dist/oxidify-v$version-x86_64-pc-windows-msvc-setup.exe"
          $install = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $binary = Join-Path $destination 'oxidify.exe'
          $actual = (Get-Item $binary).VersionInfo.ProductVersion
          if ($actual -notmatch "^$([regex]::Escape($version))(\.0)?$") { throw "Installed version is $actual, expected $version" }
          python packaging/verify_release.py installed --tag $env:RELEASE_TAG --directory $destination --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Installed payload verification failed' }
          $uninstall = Start-Process (Join-Path $destination 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
          if (Test-Path $binary) { throw 'Uninstaller left the binary behind' }

      - name: Validate archives and record source provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: python packaging/verify_release.py report --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --target "${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
            dist/*.build.json
          if-no-files-found: error

  macos:
    name: macOS universal app
    needs: [validate, checks]
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Signing and notarization run only when the Apple credentials exist as
      # repository secrets; without them the DMG ships unsigned and the
      # download page explains the Privacy & Security dance.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify checked release source
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: python packaging/verify_release.py source --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Vendor yt-dlp
        run: |
          bash third_party/yt-dlp/vendor.sh --target aarch64-apple-darwin --require
          bash third_party/yt-dlp/vendor.sh --target x86_64-apple-darwin --require

      - name: Build both architectures
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/oxidify \
            target/x86_64-apple-darwin/release/oxidify \
            -output universal/oxidify

      - name: Check universal binary
        run: |
          lipo universal/oxidify -verify_arch arm64 x86_64
          test "$(universal/oxidify --version)" = "oxidify ${RELEASE_TAG#v}"

      - name: App bundle
        run: |
          version="${RELEASE_TAG#v}"
          bash packaging/macos/bundle.sh universal/oxidify Oxidify.app "$version"

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

      - name: Sign
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" Oxidify.app

      - name: DMG
        run: |
          name="oxidify-${RELEASE_TAG}-macos-universal"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R Oxidify.app "$stage/"
          cp README.md LICENSE NOTICE "$stage/"
          cp third_party/yt-dlp/NOTICE "$stage/yt-dlp-NOTICE.txt"
          cp third_party/yt-dlp/LICENSE "$stage/yt-dlp-LICENSE.txt"
          ln -s /Applications "$stage/Applications"
          mkdir -p dist
          hdiutil create -volname Oxidify -srcfolder "$stage" -ov \
            -format UDZO "dist/$name.dmg"

      - name: Notarize
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          name="oxidify-${RELEASE_TAG}-macos-universal"
          xcrun notarytool submit "dist/$name.dmg" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "dist/$name.dmg"

      - name: Smoke-test the packaged disk image
        run: |
          mount="$RUNNER_TEMP/oxidify-dmg-test"
          hdiutil attach "dist/oxidify-${RELEASE_TAG}-macos-universal.dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          python packaging/verify_release.py macos-bundle --tag "$RELEASE_TAG" --directory "$mount/Oxidify.app"
          codesign --verify --deep --strict "$mount/Oxidify.app"
          lipo "$mount/Oxidify.app/Contents/MacOS/oxidify" -verify_arch arm64 x86_64
          test "$("$mount/Oxidify.app/Contents/MacOS/oxidify" --version)" = "oxidify ${RELEASE_TAG#v}"
          for notice in LICENSE NOTICE yt-dlp-NOTICE.txt yt-dlp-LICENSE.txt; do
            cmp "$mount/$notice" "$mount/Oxidify.app/Contents/Resources/$notice"
          done
          cmp README.md "$mount/README.md"

      - name: Validate disk image and record source provenance
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: python packaging/verify_release.py report --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --target macos-universal

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: |
            dist/*.dmg
            dist/*.build.json
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [validate, build, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify checked release source
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: python packaging/verify_release.py source --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Verify complete artifacts, source provenance, contents, and checksums
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: python packaging/verify_release.py release --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"
      - name: Guard draft-only release and create the checked tag if requested
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          options=()
          if [ -n "$RELEASE_SOURCE_INPUT" ]; then options+=(--allow-missing); fi
          python packaging/prepare_release.py prepare --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" "${options[@]}"
      - uses: softprops/action-gh-release@v2
        with:
          name: Oxidify ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ needs.validate.outputs.source_sha }}
          files: |
            dist/oxidify-*
            dist/checksums.txt
            dist/provenance.json
          body_path: packaging/release-notes/${{ env.RELEASE_TAG }}.md
          draft: true
          fail_on_unmatched_files: true
      - name: Verify uploaded draft assets and checked source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: python packaging/prepare_release.py uploaded --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"
