name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Match tag, manifest, lockfile, and notes
        shell: python
        run: |
          import os
          import pathlib
          import re
          import tomllib

          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), "Expected a stable release version"
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Tag and Cargo.toml disagree"
          packages = tomllib.loads(pathlib.Path("Cargo.lock").read_text())["package"]
          assert next(p["version"] for p in packages if p["name"] == "oxidify") == version
          notes = pathlib.Path(f"packaging/release-notes/v{version}.md")
          assert notes.is_file() and notes.read_text().strip(), "Written release notes are missing"
          config = pathlib.Path("docs/_config.yml").read_text()
          assert f'oxidify_version: "{version}"' in config.splitlines(), "Download page version differs"
          versions = pathlib.Path("docs/_data/versions.yml").read_text()
          assert f"current: v{version}" in versions.splitlines(), "Version dropdown differs"

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  build:
    name: build (${{ matrix.target }})
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # A native arm64 runner, so the GUI's system libraries need no
          # cross-compilation sysroot.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Cross-compiled from x64: the MSVC arm64 linker ships with the
          # runner's Visual Studio.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository pins its toolchain; add the cross-target's standard
      # library to the toolchain the pin actually resolves to.
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Vendor yt-dlp
        shell: bash
        run: bash third_party/yt-dlp/vendor.sh --target ${{ matrix.target }} --require

      - run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Check Linux binary version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          actual="$(target/${{ matrix.target }}/release/oxidify --version)"
          test "$actual" = "oxidify ${RELEASE_TAG#v}"

      - name: Package
        shell: bash
        run: |
          name="oxidify-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/oxidify.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/oxidify" "dist/$name/"
          fi
          cp README.md LICENSE NOTICE "dist/$name/"
          cp third_party/yt-dlp/NOTICE "dist/$name/yt-dlp-NOTICE.txt"
          cp third_party/yt-dlp/LICENSE "dist/$name/yt-dlp-LICENSE.txt"
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Desktop integration for package builds and hand-installs.
            cp -r packaging "dist/$name/"
            rm -rf "dist/$name/packaging/macos"
          fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      # Inno Setup ships with the runner image. PowerShell, because bash on
      # Windows rewrites /D... arguments as paths.
      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $arch = "${{ matrix.target }}".Split("-")[0]
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DArch=$arch" `
            "/DBinary=$PWD\target\${{ matrix.target }}\release\oxidify.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\oxidify.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test Windows x64 installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $destination = Join-Path $env:RUNNER_TEMP 'oxidify-install-test'
          $setup = Join-Path $PWD "dist/oxidify-v$version-x86_64-pc-windows-msvc-setup.exe"
          $install = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $binary = Join-Path $destination 'oxidify.exe'
          $actual = (Get-Item $binary).VersionInfo.ProductVersion
          if ($actual -notmatch "^$([regex]::Escape($version))(\.0)?$") { throw "Installed version is $actual, expected $version" }
          foreach ($notice in @('LICENSE', 'NOTICE', 'yt-dlp-NOTICE.txt', 'yt-dlp-LICENSE.txt')) {
            if (-not (Test-Path (Join-Path $destination $notice))) { throw "Missing $notice" }
          }
          $uninstall = Start-Process (Join-Path $destination 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
          if (Test-Path $binary) { throw 'Uninstaller left the binary behind' }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS universal app
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Signing and notarization run only when the Apple credentials exist as
      # repository secrets; without them the DMG ships unsigned and the
      # download page explains the Privacy & Security dance.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Vendor yt-dlp
        run: |
          bash third_party/yt-dlp/vendor.sh --target aarch64-apple-darwin --require
          bash third_party/yt-dlp/vendor.sh --target x86_64-apple-darwin --require

      - name: Build both architectures
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/oxidify \
            target/x86_64-apple-darwin/release/oxidify \
            -output universal/oxidify

      - name: Check universal binary
        run: |
          lipo universal/oxidify -verify_arch arm64 x86_64
          test "$(universal/oxidify --version)" = "oxidify ${RELEASE_TAG#v}"

      - name: App bundle
        run: |
          version="${RELEASE_TAG#v}"
          bash packaging/macos/bundle.sh universal/oxidify Oxidify.app "$version"

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

      - name: Sign
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" Oxidify.app

      - name: DMG
        run: |
          name="oxidify-${RELEASE_TAG}-macos-universal"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R Oxidify.app "$stage/"
          cp README.md LICENSE NOTICE "$stage/"
          cp third_party/yt-dlp/NOTICE "$stage/yt-dlp-NOTICE.txt"
          cp third_party/yt-dlp/LICENSE "$stage/yt-dlp-LICENSE.txt"
          ln -s /Applications "$stage/Applications"
          mkdir -p dist
          hdiutil create -volname Oxidify -srcfolder "$stage" -ov \
            -format UDZO "dist/$name.dmg"

      - name: Notarize
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          name="oxidify-${RELEASE_TAG}-macos-universal"
          xcrun notarytool submit "dist/$name.dmg" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "dist/$name.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [build, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
      - name: Verify complete artifact set
        shell: python
        run: |
          import os
          import pathlib

          tag = os.environ["RELEASE_TAG"]
          expected = {"checksums.txt", f"oxidify-{tag}-macos-universal.dmg"}
          for arch in ("x86_64", "aarch64"):
              expected.add(f"oxidify-{tag}-{arch}-unknown-linux-gnu.tar.gz")
              expected.add(f"oxidify-{tag}-{arch}-pc-windows-msvc.zip")
              expected.add(f"oxidify-{tag}-{arch}-pc-windows-msvc-setup.exe")
          actual = {p.name for p in pathlib.Path("dist").iterdir() if p.is_file()}
          assert actual == expected, f"Release files differ: {actual ^ expected}"
          assert all(p.stat().st_size for p in pathlib.Path("dist").iterdir()), "Empty release file"
      - uses: softprops/action-gh-release@v2
        with:
          name: Oxidify ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          body_path: packaging/release-notes/${{ env.RELEASE_TAG }}.md
          draft: true
          fail_on_unmatched_files: true
