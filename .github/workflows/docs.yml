name: Docs

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Deploy the published version from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      version_published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - name: Keep unpublished versions off the download page
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os
          import pathlib
          import subprocess

          lines = pathlib.Path("docs/_config.yml").read_text().splitlines()
          version = next(line.split(":", 1)[1].strip().strip('"') for line in lines if line.startswith("oxidify_version:"))
          latest = subprocess.check_output([
              "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/latest", "--jq", ".tag_name"
          ], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"published={str(latest == 'v' + version).lower()}\n")

      - uses: actions/configure-pages@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Install site dependencies
        working-directory: docs
        run: |
          bundle config set path vendor/bundle
          bundle install

      - name: Build site
        working-directory: docs
        env:
          # Analytics is only included in production builds, so a local
          # `jekyll serve` does not report visits.
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination ./_site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/_site

  deploy:
    needs: build
    if: needs.build.outputs.version_published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
