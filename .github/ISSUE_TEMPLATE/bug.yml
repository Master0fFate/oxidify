name: Bug report
description: Something does not work, or the app crashed or vanished.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Without the log, most reports cannot be acted on, so please include it. Oxidify writes the log of its last run to:

        - Linux: `~/.local/state/oxidify/oxidify.log`
        - macOS: `~/Library/Application Support/me.master0ffate.oxidify/oxidify.log`
        - Windows: `%LOCALAPPDATA%\master0ffate\oxidify\data\oxidify.log`

        If the app crashed or vanished, `panic.log` in the same folder says where it died; include that too. If no log file exists, run `oxidify -v` from a terminal (on Windows, `oxidify.exe -v` from PowerShell) and paste what it prints instead.
  - type: input
    id: version
    attributes:
      label: Oxidify version and how you installed it
      placeholder: "0.3.0 from the release zip / the DMG / the Windows installer / built from source"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Exact steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: The log file's contents from the run that misbehaved, and `panic.log` if there is one.
      render: text
    validations:
      required: true
