title: Oxidify
oxidify_version: "0.3.4"
description: A fast, native music player for your Spotify library, for Linux, macOS, and Windows, written in Rust.
lang: en-US
url: https://master0ffate.github.io
baseurl: /oxidify
logo: /assets/images/logo.svg
image: /screenshot.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /screenshot.png
      topics:
        - Spotify client
        - Rust
        - egui
        - librespot
        - Spotify Connect
        - Linux music player
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /screenshot.png
      alt: Oxidify showing a playlist with the queue open and a track playing
  llms:
    title: Oxidify
    description: >-
      Documentation for Oxidify, a fast native music player for your Spotify
      library written in Rust with egui and librespot: one lightweight app for
      your whole library, local playback, alternate audio for accounts without
      Premium, and Spotify Connect on Linux, macOS, and Windows.
    full: true
    details: >-
      The canonical documentation covers installation, signing in, everyday
      use, settings, and how the client connects to Spotify. Source is on
      [GitHub](https://github.com/Master0fFate/oxidify).
  branding:
    site_title: Oxidify
    logo:
      default: /assets/images/logo.svg
      alt: Oxidify
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>. Oxidify is an independent project derived from Fastpotify, not affiliated with or endorsed by Spotify AB or the Fastpotify author. Spotify is a trademark of Spotify AB.
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/Master0fFate/oxidify/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: Master0fFate/oxidify
    text: Star
    show_count: true
  github_sponsor:
    enabled: false

plugins:
  - jekyll-vitepress-theme

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
